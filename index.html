<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RetroGames</title>

    <link rel="icon" type="image/png" href="3410824.png">

    <link rel="stylesheet" href="style.css">
    <i class="fa-solid fa-gamepad"></i>

</head>


<body>

    <header>
        <div class="logo">🎮 RetroGames</div>
        <p>Reviva os clássicos que marcaram gerações!</p>
    </header>

    <main>
        <section class="catalogo">
            <div class="topo-catalogo">
                <div>
                    <h1>Catálogo de Jogos</h1>
                    <p>Explore nossa coleção de jogos retrô.</p>
                </div>

                <button id="abrirModal" class="btn-principal">
                    + Cadastrar Jogo
                </button>
            </div>

            <div id="listaJogos" class="grid-jogos"></div>

            <div id="mensagemVazia" class="mensagem-vazia">
                <h2>🕹️ Nenhum jogo cadastrado</h2>
                <p>Cadastre seu primeiro jogo para começar!</p>
            </div>
        </section>
    </main>

    <dialog id="modalJogo">
        <div class="modal-conteudo">
            <h2>🎮 Cadastrar Novo Jogo</h2>
            <p>Preencha as informações do jogo.</p>

            <form id="formJogo">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" required>


                <label for="plataforma">Plataforma</label>
                <select id="plataforma" required>
                    <option value="">Selecione a plataforma</option>
                    <option value="PlayStation 5">PlayStation 5 (PS5)</option>
                    <option value="PlayStation 4">PlayStation 4 (PS4)</option>
                    <option value="Xbox Series X/S">Xbox Series X/S</option>
                    <option value="Xbox One">Xbox One</option>
                    <option value="Nintendo Switch 2">Nintendo Switch 2</option>
                    <option value="Nintendo Switch">Nintendo Switch</option>
                    <option value="PC">PC (Computador)</option>
                    <option value="Steam Deck">Steam Deck</option>
                    <option value="Android">Android</option>
                    <option value="iOS">iPhone (iOS)</option>
                </select>


                <label for="desenvolvedora">Desenvolvedora</label>
                <input type="text" id="desenvolvedora" required>

                <label for="imagem_url">URL da Imagem</label>
                <input type="url" id="imagem_url" placeholder="https://exemplo.com/capa.jpg" required>

                <label for="preco">Preço (R$)</label>
                <input type="number" id="preco" min="0" step="0.01" required>

                <div class="botoes-modal">
                    <button type="button" id="cancelar" class="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-principal">Salvar</button>
                </div>
            </form>
        </div>
    </dialog>

    <footer>
        <p>© 2026 RetroGames - Desenvolvido por Samuel Gomes</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
